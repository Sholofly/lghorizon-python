name: Build & Test Python 🐍 distribution 📦
on:
  pull_request:
    branches:
      - dev

jobs:
  lint:
    name: Lint 🔍
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run ruff
        run: ruff check .

  test:
    name: Run Tests 🧪
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  test-python-3-13:
    name: Run Tests (Python 3.13) 🧪
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build:
    name: Build Python 🐍 distribution 📦
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pypa/build
        run: >-
          python -m
          pip install
          build
          --user
      - name: Build a binary wheel and a source tarball
        run: >-
          python -m
          build
          --sdist
          --wheel
          --outdir dist/
